name: CI
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    env:
      TEST_DATABASE_URL: postgresql://tpr_ci:fixture_only@127.0.0.1:5432/tpr_ci
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: tpr_ci
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: tpr_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tpr_ci -d tpr_ci"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci --no-audit --no-fund
      - run: npm run verify:baseline
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  container-smoke:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build non-root production preview image
        run: docker build --progress=plain -t public-record:ci .
      - name: Start preview without production credentials
        run: docker run -d --name public-record-preview -p 127.0.0.1:3000:3000 public-record:ci
      - name: Confirm the preview remains explicitly not production-ready
        run: |
          success=0
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --connect-timeout 3 http://127.0.0.1:3000/api/health > /tmp/tpr-health.json; then
              success=1
              break
            fi
            sleep 2
          done
          if [ "$success" -ne 1 ]; then
            docker ps -a
            docker logs public-record-preview || true
            exit 1
          fi
          node -e "const fs=require('node:fs'); const v=JSON.parse(fs.readFileSync('/tmp/tpr-health.json','utf8')); if(v.status!=='scaffold'||v.production_ready!==false) process.exit(1)"
      - name: Stop disposable preview
        if: always()
        run: docker rm -f public-record-preview || true
