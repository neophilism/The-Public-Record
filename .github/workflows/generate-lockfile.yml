name: Generate reviewed npm lockfile
on:
  push:
    branches: [feat/tpr-05-build-reliability]
permissions:
  contents: write
jobs:
  lockfile:
    if: github.repository == 'neophilism/The-Public-Record'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Create and test lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
          npm run lint
          npm run typecheck
          npm test
          npm run build
      - name: Commit lockfile on this isolated development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if ! git diff --cached --quiet; then
            git commit -m "build: lock npm dependencies after verified install"
            git push origin HEAD:feat/tpr-05-build-reliability
          fi
