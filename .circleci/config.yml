version: 2.1

# Preserve the complete source, Postgres, container and E2EESA evidence gates.
jobs:
  quality-postgres:
    docker:
      - image: cimg/node:22.23.3
      - image: cimg/postgres:16.10
        environment:
          POSTGRES_USER: tpr_ci
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: tpr_ci
    resource_class: large
    environment:
      CI: "true"
      TEST_DATABASE_URL: postgresql://tpr_ci:fixture_only@127.0.0.1:5432/tpr_ci
    steps:
      - checkout
      - run:
          name: Locked production and development dependencies
          command: npm ci --no-audit --no-fund
      - run: npm run verify:baseline
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  container-live-smoke:
    machine:
      image: ubuntu-2404:current
    resource_class: medium
    steps:
      - checkout
      - run:
          name: Build production image in real Docker daemon
          command: docker build --progress=plain -t public-record:ci .
      - run:
          name: Start preview in isolated Docker container
          command: docker run -d --name public-record-preview -p 127.0.0.1:3000:3000 public-record:ci
      - run:
          name: Enforce nonproduction status of live container
          command: |
            success=0
            for attempt in $(seq 1 30); do
              if curl --fail --silent --show-error --connect-timeout 3 http://127.0.0.1:3000/api/health > /tmp/tpr-health.json; then
                success=1
                break
              fi
              sleep 2
            done
            if [ "$success" -ne 1 ]; then
              docker ps -a
              docker logs public-record-preview || true
              exit 1
            fi
            node -e "const fs=require('node:fs'); const v=JSON.parse(fs.readFileSync('/tmp/tpr-health.json','utf8')); if(v.status!=='scaffold'||v.production_ready!==false) process.exit(1)"
      - run:
          name: Stop disposable preview
          when: always
          command: docker rm -f public-record-preview || true
  security-status-record:
    docker:
      - image: cimg/python:3.12
    resource_class: small
    steps:
      - checkout
      - run: python3 scripts/validate_e2eesa_status.py
workflows:
  all-required-checks:
    jobs:
      - quality-postgres
      - container-live-smoke:
          requires: [quality-postgres]
      - security-status-record
